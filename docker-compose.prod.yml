services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/lelion13/app-semaforo-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_KEY: ${API_KEY}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      FRONTEND_URLS: ${FRONTEND_URLS}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/fotos:/app/fotos
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ghcr.io/lelion13/app-semaforo-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.app-semaforo.rule=Host(`control.lionapp.cloud`)
      - traefik.http.routers.app-semaforo.entrypoints=websecure
      - traefik.http.routers.app-semaforo.tls=true
      - traefik.http.routers.app-semaforo.tls.certresolver=letsencrypt
      - traefik.http.services.app-semaforo.loadbalancer.server.port=80

volumes:
  db_data:
